<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Commercial workflow: from quote to invoice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.5"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f7f3"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="420" fill="url(#glow)"/>

  <!-- character -->
  <g filter="url(#soft)">
    <ellipse cx="320" cy="650" rx="110" ry="20" fill="#00482f" opacity="0.10"/>
    <path d="M258 660 q0-160 76-160 q76 0 76 160 Z" fill="#0c5e3f"/>
    <rect x="322" y="470" width="36" height="38" rx="12" fill="#e7b48f"/>
    <circle cx="340" cy="432" r="46" fill="#f0bf9b"/>
    <path d="M296 424 q0-56 44-56 q44 0 44 56 q-10-24 -44-24 q-34 0 -44 24Z" fill="#2b2330"/>
    <path d="M328 470 q-80 -30 -120 -90" fill="none" stroke="#0c5e3f" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- document stack with depth -->
  <g filter="url(#card)" transform="rotate(-7 640 400)">
    <rect x="560" y="300" width="150" height="200" rx="12" fill="#dfeee7"/>
    <rect x="575" y="285" width="150" height="200" rx="12" fill="#eaf4ee"/>
    <rect x="590" y="270" width="150" height="200" rx="12" fill="url(#paper)"/>
    <rect x="606" y="290" width="110" height="14" rx="7" fill="#cfe7dc"/>
    <rect x="606" y="316" width="118" height="9" rx="4" fill="#d9e6e0"/>
    <rect x="606" y="334" width="90" height="9" rx="4" fill="#d9e6e0"/>
    <circle cx="628" cy="392" r="13" fill="#e6c450"/>
    <rect x="650" y="384" width="70" height="16" rx="8" fill="#0c5c3e"/>
  </g>
  <g filter="url(#card)" transform="rotate(6 860 420)">
    <rect x="786" y="320" width="150" height="200" rx="12" fill="url(#paper)"/>
    <rect x="802" y="340" width="118" height="14" rx="7" fill="#cfe7dc"/>
    <rect x="802" y="366" width="118" height="9" rx="4" fill="#d9e6e0"/>
    <rect x="802" y="392" width="118" height="9" rx="4" fill="#d9e6e0"/>
    <circle cx="824" cy="436" r="13" fill="#9fe3c4"/>
    <rect x="846" y="428" width="70" height="16" rx="8" fill="#0c5c3e"/>
  </g>

  <!-- workflow arrows -->
  <g stroke="#5fc39a" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M720 380 q40 -20 80 0"/>
    <path d="M770 372 l8 8 -8 8"/>
  </g>

  <!-- floating label cards -->
  <g filter="url(#card)"><rect x="940" y="250" width="150" height="58" rx="12" fill="#fff"/><circle cx="966" cy="279" r="12" fill="#e6c450"/><rect x="986" y="268" width="84" height="9" rx="4" fill="#f0e3b4"/><rect x="986" y="284" width="56" height="7" rx="3" fill="#efe6cb"/></g>
  <g filter="url(#card)"><rect x="150" y="300" width="150" height="58" rx="12" fill="#fff"/><circle cx="176" cy="329" r="12" fill="#9fe3c4"/><rect x="196" y="318" width="84" height="9" rx="4" fill="#cfe7dc"/><rect x="196" y="334" width="56" height="7" rx="3" fill="#d9e6e0"/></g>
</svg>
