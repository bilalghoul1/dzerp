<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="One clear view of your business">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.5"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="420" fill="url(#glow)"/>

  <!-- big laptop -->
  <g filter="url(#soft)">
    <rect x="360" y="250" width="480" height="300" rx="18" fill="#1c1c22"/>
    <rect x="378" y="268" width="444" height="248" rx="10" fill="url(#screen)"/>
    <rect x="398" y="288" width="160" height="16" rx="8" fill="#9fe3c4" opacity="0.9"/>
    <!-- chart -->
    <polyline points="400,470 460,420 520,440 580,380 660,410 760,360 810,400" fill="none" stroke="#9fe3c4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="398" y="492" width="200" height="14" rx="7" fill="#0c5c3e"/>
    <!-- kpi cards -->
    <rect x="620" y="500" width="100" height="48" rx="8" fill="#e6c450" opacity="0.85"/>
    <rect x="730" y="500" width="80" height="48" rx="8" fill="#0c5c3e"/>
    <path d="M348 550 h504 l20 22 h-544 Z" fill="#2a2a32"/>
  </g>

  <!-- character pointing at screen -->
  <g filter="url(#soft)">
    <ellipse cx="900" cy="640" rx="110" ry="20" fill="#00482f" opacity="0.10"/>
    <path d="M838 650 q0-150 78-150 q78 0 78 150 Z" fill="#0c5e3f"/>
    <rect x="906" y="468" width="36" height="36" rx="12" fill="#e7b48f"/>
    <circle cx="924" cy="430" r="44" fill="#f0bf9b"/>
    <path d="M880 422 q0-54 44-54 q44 0 44 54 q-10-24 -44-24 q-34 0 -44 24Z" fill="#2b2330"/>
    <path d="M838 540 q-90 -10 -120 -70" fill="none" stroke="#0c5e3f" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- floating cards -->
  <g filter="url(#card)">
    <rect x="220" y="300" width="170" height="66" rx="14" fill="#fff"/>
    <circle cx="248" cy="333" r="14" fill="#9fe3c4"/>
    <rect x="270" y="320" width="96" height="10" rx="5" fill="#cfe7dc"/>
    <rect x="270" y="336" width="64" height="8" rx="4" fill="#d9e6e0"/>
  </g>
  <g filter="url(#card)">
    <rect x="930" y="250" width="170" height="66" rx="14" fill="#fff"/>
    <circle cx="958" cy="283" r="14" fill="#e6c450"/>
    <rect x="980" y="270" width="96" height="10" rx="5" fill="#f0e3b4"/>
    <rect x="980" y="286" width="64" height="8" rx="4" fill="#efe6cb"/>
  </g>
</svg>
