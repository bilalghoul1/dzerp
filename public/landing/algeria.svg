<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Built for Algerian businesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.5"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="420" fill="url(#glow)"/>

  <!-- stylized Algeria line-art -->
  <path d="M520 250 C580 200 700 210 740 270 C780 320 760 430 690 480 C620 530 520 510 480 450 C442 392 458 300 520 250 Z" fill="none" stroke="#5fc39a" stroke-width="3" opacity="0.7"/>
  <circle cx="610" cy="350" r="8" fill="#0c5c3e"/>
  <circle cx="680" cy="410" r="5" fill="#e6c450"/>
  <circle cx="545" cy="415" r="5" fill="#0c5c3e" opacity="0.6"/>
  <path d="M610 350 L680 410 M610 350 L545 415" stroke="#5fc39a" stroke-width="2" opacity="0.5"/>

  <!-- abstract business buildings -->
  <g opacity="0.85">
    <rect x="120" y="380" width="80" height="200" rx="8" fill="#dfeee7"/>
    <rect x="140" y="400" width="14" height="14" rx="2" fill="#9fe3c4"/>
    <rect x="170" y="400" width="14" height="14" rx="2" fill="#9fe3c4"/>
    <rect x="140" y="440" width="14" height="14" rx="2" fill="#5fc39a"/>
    <rect x="170" y="440" width="14" height="14" rx="2" fill="#5fc39a"/>
    <rect x="220" y="330" width="70" height="250" rx="8" fill="#e3efe8"/>
    <rect x="238" y="350" width="14" height="14" rx="2" fill="#e6c450"/>
    <rect x="266" y="350" width="14" height="14" rx="2" fill="#e6c450"/>
  </g>

  <!-- laptop DzERP -->
  <g filter="url(#soft)">
    <rect x="820" y="360" width="300" height="190" rx="16" fill="#1c1c22"/>
    <rect x="838" y="378" width="264" height="146" rx="8" fill="url(#screen)"/>
    <rect x="858" y="396" width="110" height="14" rx="7" fill="#9fe3c4" opacity="0.9"/>
    <rect x="858" y="424" width="224" height="12" rx="6" fill="#0c5c3e"/>
    <rect x="858" y="446" width="224" height="12" rx="6" fill="#0c5c3e" opacity="0.7"/>
    <rect x="858" y="468" width="120" height="30" rx="6" fill="#e6c450" opacity="0.85"/>
    <path d="M808 550 h344 l16 18 h-376 Z" fill="#2a2a32"/>
  </g>

  <!-- capability chips -->
  <g filter="url(#card)"><rect x="150" y="180" width="96" height="46" rx="12" fill="#fff"/><text x="198" y="208" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#0c5c3e" text-anchor="middle">NIF</text></g>
  <g filter="url(#card)"><rect x="280" y="160" width="96" height="46" rx="12" fill="#fff"/><text x="328" y="188" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#0c5c3e" text-anchor="middle">NIS</text></g>
  <g filter="url(#card)"><rect x="930" y="260" width="96" height="46" rx="12" fill="#fff"/><text x="978" y="288" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#0c5c3e" text-anchor="middle">RC</text></g>
  <g filter="url(#card)"><rect x="900" y="180" width="96" height="46" rx="12" fill="#fff"/><text x="948" y="208" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#0c5c3e" text-anchor="middle">DZD</text></g>
</svg>
