<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Your business is under control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.6"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="360" r="430" fill="url(#glow)"/>
  <ellipse cx="600" cy="660" rx="360" ry="34" fill="#00482f" opacity="0.07"/>

  <!-- calm office environment: soft panels -->
  <g opacity="0.5">
    <rect x="120" y="220" width="160" height="300" rx="14" fill="#e3efe8"/>
    <rect x="940" y="220" width="140" height="300" rx="14" fill="#e3efe8"/>
  </g>

  <!-- confident manager -->
  <g filter="url(#soft)">
    <ellipse cx="600" cy="650" rx="120" ry="22" fill="#00482f" opacity="0.10"/>
    <path d="M520 660 q0-170 80-170 q80 0 80 170 Z" fill="#0c5e3f"/>
    <rect x="588" y="468" width="40" height="40" rx="14" fill="#e7b48f"/>
    <circle cx="608" cy="426" r="50" fill="#f0bf9b"/>
    <path d="M558 418 q0-60 50-60 q50 0 50 60 q-12-26 -50-26 q-38 0 -50 26Z" fill="#2b2330"/>
    <path d="M560 540 q-30 -60 30 -120 q60 60 30 120Z" fill="#0a5436" opacity="0.5"/>
  </g>

  <!-- laptop -->
  <g filter="url(#soft)">
    <rect x="640" y="430" width="360" height="220" rx="16" fill="#1c1c22"/>
    <rect x="658" y="448" width="324" height="178" rx="8" fill="url(#screen)"/>
    <rect x="678" y="466" width="130" height="14" rx="7" fill="#9fe3c4" opacity="0.9"/>
    <rect x="678" y="492" width="284" height="54" rx="8" fill="#0c5c3e"/>
    <rect x="678" y="558" width="130" height="44" rx="8" fill="#e6c450" opacity="0.85"/>
    <rect x="824" y="558" width="138" height="44" rx="8" fill="#0c5c3e" opacity="0.7"/>
    <path d="M618 650 h404 l18 20 h-440 Z" fill="#2a2a32"/>
  </g>

  <!-- floating check card -->
  <g filter="url(#card)"><rect x="220" y="330" width="160" height="66" rx="14" fill="#fff"/><circle cx="250" cy="363" r="15" fill="#9fe3c4"/><path d="M244 363 l4 4 8-9" fill="none" stroke="#00482f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="352" width="86" height="10" rx="5" fill="#cfe7dc"/><rect x="274" y="368" width="58" height="8" rx="4" fill="#d9e6e0"/></g>
</svg>
