<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Business owner managing the company from one DzERP platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faf6"/>
      <stop offset="1" stop-color="#e7f4ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#87d7ad" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#87d7ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laptopScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5c3c"/>
      <stop offset="1" stop-color="#00482f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe3c4"/>
      <stop offset="1" stop-color="#5fc39a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d98a"/>
      <stop offset="1" stop-color="#e6c450"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="320" r="430" fill="url(#glow)"/>
  <circle cx="930" cy="180" r="120" fill="url(#gold)" opacity="0.10"/>
  <circle cx="250" cy="560" r="90" fill="url(#mint)" opacity="0.12"/>

  <!-- floor shadow -->
  <ellipse cx="600" cy="660" rx="330" ry="34" fill="#00482f" opacity="0.08"/>

  <!-- manager character -->
  <g filter="url(#soft)">
    <ellipse cx="560" cy="640" rx="120" ry="22" fill="#00482f" opacity="0.10"/>
    <!-- body -->
    <path d="M470 660 q0-150 90-150 q90 0 90 150 Z" fill="#0c5e3f"/>
    <path d="M470 660 q0-150 90-150 q90 0 90 150 Z" fill="#0a5436" opacity="0.4"/>
    <!-- neck -->
    <rect x="540" y="470" width="40" height="40" rx="14" fill="#e7b48f"/>
    <!-- head -->
    <circle cx="560" cy="430" r="48" fill="#f0bf9b"/>
    <path d="M512 420 q0-58 48-58 q48 0 48 58 q-12-26 -48-26 q-36 0 -48 26Z" fill="#2b2330"/>
    <!-- smile -->
    <path d="M540 448 q20 16 40 0" fill="none" stroke="#9c6b4a" stroke-width="3" stroke-linecap="round"/>
    <!-- arm to laptop -->
    <path d="M620 540 q70 -10 96 -56" fill="none" stroke="#0c5e3f" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- laptop -->
  <g filter="url(#soft)">
    <rect x="640" y="430" width="380" height="232" rx="16" fill="#1c1c22"/>
    <rect x="656" y="446" width="348" height="190" rx="8" fill="url(#laptopScreen)"/>
    <!-- abstract DzERP UI on screen -->
    <rect x="672" y="462" width="120" height="14" rx="7" fill="#9fe3c4" opacity="0.9"/>
    <rect x="672" y="486" width="316" height="60" rx="8" fill="#0c5c3e"/>
    <rect x="686" y="500" width="70" height="10" rx="5" fill="#9fe3c4" opacity="0.7"/>
    <rect x="686" y="518" width="120" height="10" rx="5" fill="#5fc39a" opacity="0.5"/>
    <rect x="672" y="560" width="96" height="58" rx="8" fill="#e6c450" opacity="0.85"/>
    <rect x="784" y="560" width="96" height="58" rx="8" fill="#0c5c3e"/>
    <rect x="896" y="560" width="96" height="58" rx="8" fill="#0c5c3e" opacity="0.7"/>
    <!-- base -->
    <path d="M628 662 h404 l22 22 h-448 Z" fill="#2a2a32"/>
  </g>

  <!-- phone -->
  <g filter="url(#card)">
    <rect x="250" y="470" width="120" height="220" rx="22" fill="#15151b"/>
    <rect x="260" y="482" width="100" height="196" rx="14" fill="url(#laptopScreen)"/>
    <rect x="272" y="498" width="76" height="12" rx="6" fill="#9fe3c4" opacity="0.9"/>
    <rect x="272" y="520" width="76" height="40" rx="8" fill="#0c5c3e"/>
    <rect x="272" y="570" width="76" height="40" rx="8" fill="#e6c450" opacity="0.8"/>
  </g>

  <!-- floating cards -->
  <g filter="url(#card)">
    <rect x="900" y="300" width="190" height="74" rx="14" fill="#ffffff"/>
    <circle cx="930" cy="337" r="16" fill="#9fe3c4"/>
    <rect x="954" y="322" width="104" height="11" rx="5" fill="#cfe7dc"/>
    <rect x="954" y="340" width="70" height="9" rx="4" fill="#d9e6e0"/>
  </g>
  <g filter="url(#card)">
    <rect x="120" y="350" width="180" height="70" rx="14" fill="#ffffff"/>
    <circle cx="150" cy="385" r="15" fill="#e6c450"/>
    <rect x="174" y="370" width="100" height="11" rx="5" fill="#f0e3b4"/>
    <rect x="174" y="386" width="66" height="9" rx="4" fill="#efe6cb"/>
  </g>
  <g filter="url(#card)">
    <rect x="930" y="560" width="186" height="70" rx="14" fill="#ffffff"/>
    <circle cx="960" cy="595" r="15" fill="#5fc39a"/>
    <rect x="984" y="580" width="104" height="11" rx="5" fill="#cfe7dc"/>
    <rect x="984" y="596" width="72" height="9" rx="4" fill="#d9e6e0"/>
  </g>
</svg>
