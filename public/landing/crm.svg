<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Customer relationship management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.5"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="420" fill="url(#glow)"/>

  <!-- character -->
  <g filter="url(#soft)">
    <ellipse cx="860" cy="650" rx="110" ry="20" fill="#00482f" opacity="0.10"/>
    <path d="M800 660 q0-155 78-155 q78 0 78 155 Z" fill="#0c5e3f"/>
    <rect x="866" y="470" width="36" height="38" rx="12" fill="#e7b48f"/>
    <circle cx="884" cy="432" r="46" fill="#f0bf9b"/>
    <path d="M840 424 q0-56 44-56 q44 0 44 56 q-10-24 -44-24 q-34 0 -44 24Z" fill="#2b2330"/>
    <path d="M838 540 q90 -10 120 -70" fill="none" stroke="#0c5e3f" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- tablet with CRM -->
  <g filter="url(#soft)">
    <rect x="360" y="300" width="300" height="320" rx="20" fill="#1c1c22"/>
    <rect x="378" y="318" width="264" height="284" rx="10" fill="url(#screen)"/>
    <rect x="398" y="338" width="120" height="14" rx="7" fill="#9fe3c4" opacity="0.9"/>
    <circle cx="430" cy="420" r="26" fill="#9fe3c4"/>
    <rect x="470" y="404" width="130" height="12" rx="6" fill="#cfe7dc"/>
    <rect x="470" y="424" width="90" height="9" rx="4" fill="#d9e6e0"/>
    <rect x="398" y="470" width="224" height="40" rx="8" fill="#0c5c3e"/>
    <rect x="398" y="520" width="224" height="40" rx="8" fill="#0c5c3e" opacity="0.7"/>
  </g>

  <!-- floating client cards -->
  <g filter="url(#card)"><rect x="720" y="250" width="180" height="64" rx="14" fill="#fff"/><circle cx="748" cy="282" r="14" fill="#9fe3c4"/><rect x="770" y="270" width="104" height="10" rx="5" fill="#cfe7dc"/><rect x="770" y="286" width="70" height="8" rx="4" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="760" y="470" width="180" height="64" rx="14" fill="#fff"/><circle cx="788" cy="502" r="14" fill="#e6c450"/><rect x="810" y="490" width="104" height="10" rx="5" fill="#f0e3b4"/><rect x="810" y="506" width="70" height="8" rx="4" fill="#efe6cb"/></g>
  <g filter="url(#card)"><rect x="200" y="300" width="170" height="60" rx="14" fill="#fff"/><circle cx="228" cy="330" r="13" fill="#5fc39a"/><rect x="248" y="320" width="96" height="9" rx="4" fill="#cfe7dc"/><rect x="248" y="334" width="64" height="7" rx="3" fill="#d9e6e0"/></g>
</svg>
