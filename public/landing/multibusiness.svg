<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Manage multiple businesses from one platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.55"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00482f" flood-opacity="0.18"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="375" r="380" fill="url(#glow)"/>

  <!-- lines from core to companies -->
  <g stroke="#5fc39a" stroke-width="3" opacity="0.5" fill="none">
    <path d="M600 375 L300 250"/>
    <path d="M600 375 L900 250"/>
    <path d="M600 375 L300 500"/>
    <path d="M600 375 L900 500"/>
  </g>

  <!-- central platform -->
  <g filter="url(#soft)">
    <rect x="520" y="320" width="160" height="110" rx="16" fill="url(#core)"/>
    <rect x="540" y="344" width="120" height="14" rx="7" fill="#9fe3c4" opacity="0.9"/>
    <rect x="540" y="370" width="120" height="10" rx="5" fill="#5fc39a" opacity="0.7"/>
    <rect x="540" y="390" width="80" height="10" rx="5" fill="#e6c450" opacity="0.85"/>
  </g>

  <!-- company buildings -->
  <g filter="url(#card)"><rect x="220" y="210" width="160" height="90" rx="14" fill="#fff"/><circle cx="252" cy="244" r="16" fill="#9fe3c4"/><rect x="276" y="232" width="86" height="10" rx="5" fill="#cfe7dc"/><rect x="276" y="250" width="60" height="8" rx="4" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="820" y="210" width="160" height="90" rx="14" fill="#fff"/><circle cx="852" cy="244" r="16" fill="#e6c450"/><rect x="876" y="232" width="86" height="10" rx="5" fill="#f0e3b4"/><rect x="876" y="250" width="60" height="8" rx="4" fill="#efe6cb"/></g>
  <g filter="url(#card)"><rect x="220" y="460" width="160" height="90" rx="14" fill="#fff"/><circle cx="252" cy="494" r="16" fill="#5fc39a"/><rect x="276" y="482" width="86" height="10" rx="5" fill="#cfe7dc"/><rect x="276" y="500" width="60" height="8" rx="4" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="820" y="460" width="160" height="90" rx="14" fill="#fff"/><circle cx="852" cy="494" r="16" fill="#9fe3c4"/><rect x="876" y="482" width="86" height="10" rx="5" fill="#cfe7dc"/><rect x="876" y="500" width="60" height="8" rx="4" fill="#d9e6e0"/></g>
</svg>
