<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="One platform connecting all your business modules">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.55"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00482f" flood-opacity="0.18"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="375" r="380" fill="url(#glow)"/>

  <!-- connecting lines -->
  <g stroke="#5fc39a" stroke-width="3" opacity="0.55" fill="none">
    <path d="M600 375 L300 200"/>
    <path d="M600 375 L900 200"/>
    <path d="M600 375 L220 480"/>
    <path d="M600 375 L980 480"/>
    <path d="M600 375 L600 150"/>
    <path d="M600 375 L380 600"/>
    <path d="M600 375 L820 600"/>
  </g>

  <!-- central glowing core -->
  <g filter="url(#soft)">
    <circle cx="600" cy="375" r="92" fill="url(#core)"/>
    <circle cx="600" cy="375" r="92" fill="none" stroke="#9fe3c4" stroke-width="3" opacity="0.6"/>
    <rect x="566" y="338" width="68" height="14" rx="7" fill="#9fe3c4" opacity="0.9"/>
    <rect x="566" y="362" width="68" height="10" rx="5" fill="#5fc39a" opacity="0.7"/>
    <rect x="566" y="382" width="68" height="10" rx="5" fill="#e6c450" opacity="0.8"/>
    <rect x="566" y="402" width="48" height="10" rx="5" fill="#5fc39a" opacity="0.6"/>
  </g>

  <!-- module nodes -->
  <g filter="url(#card)"><rect x="240" y="168" width="120" height="64" rx="14" fill="#fff"/><circle cx="270" cy="200" r="14" fill="#9fe3c4"/><rect x="292" y="190" width="56" height="9" rx="4" fill="#cfe7dc"/><rect x="292" y="204" width="40" height="7" rx="3" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="840" y="168" width="120" height="64" rx="14" fill="#fff"/><circle cx="870" cy="200" r="14" fill="#e6c450"/><rect x="892" y="190" width="56" height="9" rx="4" fill="#f0e3b4"/><rect x="892" y="204" width="40" height="7" rx="3" fill="#efe6cb"/></g>
  <g filter="url(#card)"><rect x="160" y="448" width="120" height="64" rx="14" fill="#fff"/><circle cx="190" cy="480" r="14" fill="#5fc39a"/><rect x="212" y="470" width="56" height="9" rx="4" fill="#cfe7dc"/><rect x="212" y="484" width="40" height="7" rx="3" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="920" y="448" width="120" height="64" rx="14" fill="#fff"/><circle cx="950" cy="480" r="14" fill="#9fe3c4"/><rect x="972" y="470" width="56" height="9" rx="4" fill="#cfe7dc"/><rect x="972" y="484" width="40" height="7" rx="3" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="540" y="118" width="120" height="64" rx="14" fill="#fff"/><circle cx="570" cy="150" r="14" fill="#e6c450"/><rect x="592" y="140" width="56" height="9" rx="4" fill="#f0e3b4"/><rect x="592" y="154" width="40" height="7" rx="3" fill="#efe6cb"/></g>
  <g filter="url(#card)"><rect x="320" y="568" width="120" height="64" rx="14" fill="#fff"/><circle cx="350" cy="600" r="14" fill="#9fe3c4"/><rect x="372" y="590" width="56" height="9" rx="4" fill="#cfe7dc"/><rect x="372" y="604" width="40" height="7" rx="3" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="760" y="568" width="120" height="64" rx="14" fill="#fff"/><circle cx="790" cy="600" r="14" fill="#5fc39a"/><rect x="812" y="590" width="56" height="9" rx="4" fill="#cfe7dc"/><rect x="812" y="604" width="40" height="7" rx="3" fill="#d9e6e0"/></g>
</svg>
