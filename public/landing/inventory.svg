<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Inventory and warehouse management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.5"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="420" fill="url(#glow)"/>

  <!-- warehouse shelves -->
  <g opacity="0.9">
    <rect x="120" y="200" width="320" height="320" rx="10" fill="#e3efe8"/>
    <rect x="140" y="230" width="280" height="60" rx="6" fill="#cfe7dc"/>
    <rect x="140" y="310" width="280" height="60" rx="6" fill="#d9e6e0"/>
    <rect x="140" y="390" width="280" height="60" rx="6" fill="#cfe7dc"/>
    <rect x="160" y="244" width="60" height="32" rx="4" fill="#9fe3c4"/>
    <rect x="240" y="244" width="60" height="32" rx="4" fill="#5fc39a"/>
    <rect x="320" y="244" width="60" height="32" rx="4" fill="#9fe3c4"/>
    <rect x="160" y="324" width="60" height="32" rx="4" fill="#5fc39a"/>
    <rect x="240" y="324" width="60" height="32" rx="4" fill="#9fe3c4"/>
  </g>

  <!-- character with tablet -->
  <g filter="url(#soft)">
    <ellipse cx="760" cy="650" rx="110" ry="20" fill="#00482f" opacity="0.10"/>
    <path d="M700 660 q0-155 78-155 q78 0 78 155 Z" fill="#0c5e3f"/>
    <rect x="766" y="470" width="36" height="38" rx="12" fill="#e7b48f"/>
    <circle cx="784" cy="432" r="46" fill="#f0bf9b"/>
    <path d="M740 424 q0-56 44-56 q44 0 44 56 q-10-24 -44-24 q-34 0 -44 24Z" fill="#2b2330"/>
    <rect x="700" y="520" width="120" height="80" rx="10" fill="#15151b"/>
    <rect x="708" y="528" width="104" height="64" rx="6" fill="url(#screen)"/>
    <rect x="716" y="540" width="80" height="10" rx="5" fill="#9fe3c4" opacity="0.8"/>
    <rect x="716" y="558" width="80" height="8" rx="4" fill="#5fc39a" opacity="0.6"/>
  </g>

  <!-- floating product boxes -->
  <g filter="url(#card)"><rect x="880" y="300" width="150" height="120" rx="14" fill="#fff"/><rect x="900" y="320" width="110" height="14" rx="7" fill="#cfe7dc"/><rect x="900" y="346" width="110" height="9" rx="4" fill="#d9e6e0"/><circle cx="928" cy="392" r="14" fill="#e6c450"/></g>
  <g filter="url(#card)"><rect x="560" y="250" width="150" height="60" rx="14" fill="#fff"/><circle cx="588" cy="280" r="13" fill="#9fe3c4"/><rect x="608" y="270" width="84" height="9" rx="4" fill="#cfe7dc"/><rect x="608" y="284" width="56" height="7" rx="3" fill="#d9e6e0"/></g>
</svg>
