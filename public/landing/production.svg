<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Production and manufacturing management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.5"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="420" fill="url(#glow)"/>

  <!-- machine / work center -->
  <g opacity="0.92" filter="url(#soft)">
    <rect x="120" y="300" width="200" height="250" rx="14" fill="#dfeee7"/>
    <rect x="150" y="330" width="140" height="90" rx="10" fill="#cfe7dc"/>
    <circle cx="220" cy="375" r="34" fill="#9fe3c4"/>
    <circle cx="220" cy="375" r="14" fill="#0c5c3e"/>
    <rect x="150" y="440" width="140" height="70" rx="8" fill="#5fc39a"/>
  </g>

  <!-- character -->
  <g filter="url(#soft)">
    <ellipse cx="640" cy="650" rx="110" ry="20" fill="#00482f" opacity="0.10"/>
    <path d="M580 660 q0-155 78-155 q78 0 78 155 Z" fill="#0c5e3f"/>
    <rect x="646" y="470" width="36" height="38" rx="12" fill="#e7b48f"/>
    <circle cx="664" cy="432" r="46" fill="#f0bf9b"/>
    <path d="M620 424 q0-56 44-56 q44 0 44 56 q-10-24 -44-24 q-34 0 -44 24Z" fill="#2b2330"/>
    <path d="M640 470 q-90 -10 -120 -70" fill="none" stroke="#0c5e3f" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- tablet BOM -->
  <g filter="url(#soft)">
    <rect x="820" y="320" width="240" height="300" rx="16" fill="#1c1c22"/>
    <rect x="838" y="338" width="204" height="264" rx="8" fill="url(#screen)"/>
    <rect x="858" y="356" width="100" height="13" rx="6" fill="#9fe3c4" opacity="0.9"/>
    <rect x="858" y="384" width="164" height="40" rx="8" fill="#0c5c3e"/>
    <rect x="858" y="436" width="164" height="40" rx="8" fill="#0c5c3e" opacity="0.7"/>
    <rect x="858" y="488" width="164" height="40" rx="8" fill="#e6c450" opacity="0.8"/>
  </g>

  <!-- floating components -->
  <g filter="url(#card)"><rect x="500" y="250" width="150" height="60" rx="14" fill="#fff"/><circle cx="528" cy="280" r="13" fill="#9fe3c4"/><rect x="548" y="270" width="84" height="9" rx="4" fill="#cfe7dc"/><rect x="548" y="284" width="56" height="7" rx="3" fill="#d9e6e0"/></g>
  <g filter="url(#card)"><rect x="520" y="470" width="150" height="60" rx="14" fill="#fff"/><circle cx="548" cy="500" r="13" fill="#e6c450"/><rect x="568" y="490" width="84" height="9" rx="4" fill="#f0e3b4"/><rect x="568" y="504" width="56" height="7" rx="3" fill="#efe6cb"/></g>
</svg>
