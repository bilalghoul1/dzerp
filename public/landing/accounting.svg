<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Accounting and finance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#87d7ad" stop-opacity="0.5"/><stop offset="1" stop-color="#87d7ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3c"/><stop offset="1" stop-color="#00482f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3c4"/><stop offset="1" stop-color="#5fc39a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d98a"/><stop offset="1" stop-color="#e6c450"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00482f" flood-opacity="0.16"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00482f" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="420" fill="url(#glow)"/>

  <!-- character -->
  <g filter="url(#soft)">
    <ellipse cx="320" cy="650" rx="110" ry="20" fill="#00482f" opacity="0.10"/>
    <path d="M258 660 q0-160 76-160 q76 0 76 160 Z" fill="#0c5e3f"/>
    <rect x="322" y="470" width="36" height="38" rx="12" fill="#e7b48f"/>
    <circle cx="340" cy="432" r="46" fill="#f0bf9b"/>
    <path d="M296 424 q0-56 44-56 q44 0 44 56 q-10-24 -44-24 q-34 0 -44 24Z" fill="#2b2330"/>
    <path d="M340 470 q80 -20 110 -90" fill="none" stroke="#0c5e3f" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- laptop with finance UI -->
  <g filter="url(#soft)">
    <rect x="560" y="320" width="380" height="240" rx="16" fill="#1c1c22"/>
    <rect x="578" y="338" width="344" height="196" rx="8" fill="url(#screen)"/>
    <rect x="598" y="356" width="120" height="14" rx="7" fill="#9fe3c4" opacity="0.9"/>
    <!-- simple financial graph -->
    <polyline points="600,500 650,470 700,486 760,440 820,470 890,420" fill="none" stroke="#e6c450" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="598" y="510" width="140" height="14" rx="7" fill="#0c5c3e"/>
    <rect x="760" y="510" width="140" height="14" rx="7" fill="#0c5c3e" opacity="0.7"/>
    <path d="M548 560 h404 l18 20 h-440 Z" fill="#2a2a32"/>
  </g>

  <!-- floating accounting sheets -->
  <g filter="url(#card)"><rect x="930" y="260" width="160" height="70" rx="14" fill="#fff"/><circle cx="958" cy="295" r="13" fill="#e6c450"/><rect x="978" y="284" width="92" height="9" rx="4" fill="#f0e3b4"/><rect x="978" y="300" width="62" height="7" rx="3" fill="#efe6cb"/></g>
  <g filter="url(#card)"><rect x="180" y="300" width="160" height="70" rx="14" fill="#fff"/><circle cx="208" cy="335" r="13" fill="#9fe3c4"/><rect x="228" y="324" width="92" height="9" rx="4" fill="#cfe7dc"/><rect x="228" y="340" width="62" height="7" rx="3" fill="#d9e6e0"/></g>
  <!-- subtle DZD mark -->
  <g filter="url(#card)"><rect x="940" y="470" width="120" height="60" rx="14" fill="#fff"/><text x="1000" y="510" font-family="IBM Plex Sans, sans-serif" font-size="28" font-weight="700" fill="#0c5c3e" text-anchor="middle">DZD</text></g>
</svg>
